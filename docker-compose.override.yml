# Local development only. Compose loads this file automatically with a plain
# `docker compose up`, and ignores it when files are named with -f (as on the server).
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  api:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Dashboard edits show up on a browser refresh, without rebuilding the image.
      - ./app/static:/srv/medvora/app/static:ro
    environment:
      # Generous limits for trying things out in the dashboard; production keeps the defaults.
      RATE_LIMIT_UPLOADS_PER_HOUR: "200"
      RATE_LIMIT_RECORDS_PER_MINUTE: "600"
